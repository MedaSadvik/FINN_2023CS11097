name: refresh-symbols
# Downloads NSE's list of listed companies (symbol and name) and commits frontend/data/symbols.json. The website uses it
# for search, "did you mean" and to refuse symbols that do not exist. New listings appear after the next run.
# Run it by hand once after merging, so the full list is in place.
on:
  schedule:
    - cron: "30 3 1 * *"     # 09:00 IST on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-symbols
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download the NSE list
        run: python scripts/fetch_symbols.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          if git diff --quiet -- frontend/data/symbols.json; then echo "No change."; exit 0; fi
          git config user.name "finn-refresh"
          git config user.email "finn-refresh@users.noreply.github.com"
          git add frontend/data/symbols.json
          git commit -m "Refresh NSE symbol list $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
