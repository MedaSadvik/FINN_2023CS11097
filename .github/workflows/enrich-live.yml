name: enrich-live
# Rebuilds on-demand companies that lack the newer research sections (business snapshot, multi-year numbers).
# Start it by hand from the Actions tab. Companies are done one at a time, reusing cached transcripts and answers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrich-live
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      tickers: ${{ steps.find.outputs.tickers }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: find
        run: echo "tickers=$(python scripts/enrich_live.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    if: needs.list.outputs.tickers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        ticker: ${{ fromJSON(needs.list.outputs.tickers) }}
    env:
      TICKER: ${{ matrix.ticker }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FLASH_MODEL: ${{ vars.GEMINI_FLASH_MODEL || 'gemini-3.5-flash' }}
      GEMINI_PRO_MODEL: ${{ vars.GEMINI_PRO_MODEL || 'gemini-3.5-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.7-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install requests pymupdf google-genai
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: pipeline-cache-${{ matrix.ticker }}-${{ github.run_id }}
          restore-keys: pipeline-cache-${{ matrix.ticker }}-
      # Request id 0 matches no row in build_requests, so the progress update is a harmless no-op.
      - name: Rebuild and publish
        run: python scripts/worker_build.py "$TICKER" 0
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/cache
          key: pipeline-cache-${{ matrix.ticker }}-${{ github.run_id }}
