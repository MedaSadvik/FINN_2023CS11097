name: refresh-feed
# Refreshes the Today feed twice each weekday: filings (NSE), end-of-day prices (Yahoo), results numbers (screener.in),
# and who a new executive is (Gemini, only for filings not already read). Then commits frontend/data/feed_live.json,
# which redeploys the site.
#
# If a source fails (NSE blocks many cloud addresses), the feed keeps that part's previous data and says so on the page.
on:
  schedule:
    - cron: "30 2 * * 1-5"    # 08:00 IST, overnight filings
    - cron: "30 12 * * 1-5"   # 18:00 IST, after the close and the day's results
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The shipped site only ever uses Gemini. Never a test provider.
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FLASH_MODEL: ${{ vars.GEMINI_FLASH_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_PRO_MODEL: ${{ vars.GEMINI_PRO_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash,gemini-3.6-flash,gemini-3.7-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install requests yfinance pymupdf google-genai
      # Model answers and downloaded PDFs are cached on disk by the pipeline. Keeping them means a filing is read once, ever.
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: refresh-cache-${{ github.run_id }}
          restore-keys: refresh-cache-
      - name: Refresh
        run: python scripts/refresh_feed.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/cache
          key: refresh-cache-${{ github.run_id }}
      - name: Commit the feed
        run: |
          if git diff --quiet -- frontend/data/feed_live.json; then echo "No change."; exit 0; fi
          git config user.name "finn-refresh"
          git config user.email "finn-refresh@users.noreply.github.com"
          git add frontend/data/feed_live.json
          git commit -m "Refresh feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
