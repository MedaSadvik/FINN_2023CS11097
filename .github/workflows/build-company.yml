name: build-company
# Builds research for one company on request. Started by the website through the GitHub API.
# The model key and the Supabase secret key live in this repository's Actions secrets: the website never sees them.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: NSE symbol, e.g. INFY
        required: true
      request_id:
        description: build_requests.id to report progress on
        required: true

permissions:
  contents: read

# One build at a time, so several requests cannot burn the daily model quota together.
concurrency:
  group: build-company
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Inputs go in through the environment, never pasted into the shell command.
      TICKER: ${{ inputs.ticker }}
      REQUEST_ID: ${{ inputs.request_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FLASH_MODEL: ${{ vars.GEMINI_FLASH_MODEL || 'gemini-3.5-flash' }}
      GEMINI_PRO_MODEL: ${{ vars.GEMINI_PRO_MODEL || 'gemini-3.5-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.7-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install requests pymupdf google-genai
      - name: Build and publish
        run: python scripts/worker_build.py "$TICKER" "$REQUEST_ID"
      - name: Report a crash
        if: failure()
        run: python scripts/worker_build.py "$TICKER" "$REQUEST_ID" --fail
